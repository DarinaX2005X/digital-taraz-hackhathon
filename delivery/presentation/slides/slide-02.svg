<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title">
<title id="title">AI готовит материалы по вашим условиям</title>
<rect width="1440" height="810" fill="#081D18"/>
<text font-family="Noto Sans, sans-serif" font-size="60" font-weight="700" fill="#F3F6F4" text-anchor="start">
