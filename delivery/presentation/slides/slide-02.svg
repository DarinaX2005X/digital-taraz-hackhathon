<tspan x="80" y="364.67">проверяет сроки, суммы и условия,</tspan>
<tspan x="80" y="400.92">собирает новые материалы.</tspan>
</text>
<text font-family="Noto Sans, sans-serif" font-size="31" font-weight="700" fill="#F3F6F4" text-anchor="start">
<tspan x="80" y="584.38">Результат сохраняется</tspan>
<tspan x="80" y="623.13">в рабочем проекте.</tspan>
</text>
