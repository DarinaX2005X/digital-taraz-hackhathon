<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title">
<title id="title">Изменения сохраняют ваши решения</title>
<rect width="1440" height="810" fill="#102B26"/>
<text font-family="Noto Sans, sans-serif" font-size="62" font-weight="700" fill="#F3F6F4" text-anchor="start">
<tspan x="80" y="132.76">Изменения сохраняют</tspan>
<tspan x="80" y="210.26">ваши решения</tspan>
</text>
<text font-family="Noto Sans, sans-serif" font-size="30" font-weight="400" fill="#B7CFC4" text-anchor="start">
<tspan x="80" y="359.4">Адресные правки проходят</tspan>
<tspan x="80" y="396.9">по связанным материалам.</tspan>
<tspan x="80" y="434.4">Закреплённый текст и формулы</tspan>
<tspan x="80" y="471.9">остаются на месте.</tspan>
</text>
<polygon points="849,679 1359,679 1387,701 877,701" fill="#04100D"/>
<polygon points="1321,289 1335,303 1335,685 1321,671" fill="#557C6D"/>
<polygon points="837,671 1321,671 1335,685 851,685" fill="#78998A"/>
<polygon points="837,289 1276,289 1321,334 1321,671 837,671" fill="#F3F6F4"/>
<polygon points="1276,289 1276,334 1321,334" fill="#B1CABC"/>
<text font-family="Noto Sans, sans-serif" font-size="40" font-weight="700" fill="#17332E" text-anchor="start">
<tspan x="872" y="373.2">Ваш текст</tspan>
</text>
<rect x="869" y="425" width="414" height="92" rx="8" fill="#B8DEC9"/>
<text font-family="Noto Sans, sans-serif" font-size="30" font-weight="700" fill="#17332E" text-anchor="start">
<tspan x="898" y="481.4">Ручная правка</tspan>
</text>
<text font-family="Noto Sans, sans-serif" font-size="31" font-weight="400" fill="#17332E" text-anchor="start">
<tspan x="872" y="595.38">=SUM(B2:B6)</tspan>
</text>
<rect x="1045" y="267" width="100" height="24" rx="5" fill="#D78670"/>
<rect x="1065" y="281" width="60" height="23" rx="5" fill="#BD6B57"/>
</svg>
